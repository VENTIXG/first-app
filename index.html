<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Force Calculator — Morison Dashboard</title>

  <!-- Apply saved theme before first paint to avoid a flash -->
  <script>
    if (localStorage.getItem('wfc-theme') === 'dark' ||
        (!localStorage.getItem('wfc-theme') &&
         window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🌊&lt;/text&gt;&lt;/svg&gt;">

  <style>
    /* Chart color tokens (validated palette) — swapped by the .dark class */
    :root {
      --series-1: #2a78d6;      /* drag    */
      --series-2: #1baf7a;      /* inertia */
      --series-3: #eda100;      /* total   */
      --chart-grid: #e1e0d9;
      --chart-axis: #c3c2b7;
      --chart-ink-muted: #898781;
    }
    .dark {
      --series-1: #3987e5;
      --series-2: #199e70;
      --series-3: #c98500;
      --chart-grid: #2c2c2a;
      --chart-axis: #383835;
      --chart-ink-muted: #898781;
    }
  </style>
</head>

<body class="min-h-screen bg-neutral-100 text-neutral-900 antialiased dark:bg-neutral-900 dark:text-neutral-100">

  <!-- Header -->
  <header class="sticky top-0 z-20 flex items-center justify-between border-b border-black/5
                 bg-white/80 px-6 py-3 backdrop-blur dark:border-white/10 dark:bg-neutral-900/80">
    <div>
      <h1 class="text-lg font-semibold">🌊 Wave Force Calculator</h1>
      <p class="text-xs text-neutral-500 dark:text-neutral-400">
        Morison equation · MacCamy–Fuchs diffraction · Airy &amp; Stokes 5th order wave theory
      </p>
    </div>
    <button id="theme-toggle"
      class="rounded-lg border border-neutral-300 px-3 py-1.5 text-sm hover:bg-neutral-100
             dark:border-neutral-600 dark:hover:bg-neutral-800">🌙 Dark</button>
  </header>

  <div class="flex min-h-[calc(100vh-61px)]">

    <!-- Sidebar: inputs (generated by main.js from the field schema) -->
    <aside class="w-80 shrink-0 space-y-8 overflow-y-auto border-r border-black/5 bg-white
                  px-5 py-6 dark:border-white/10 dark:bg-neutral-800/40" id="inputs">
    </aside>

    <!-- Main area -->
    <main class="flex-1 space-y-6 px-6 py-6">

      <!-- Warning banner (wave breaking — wired in Phase 2) -->
      <div id="warning-banner" class="hidden rounded-xl border border-red-300 bg-red-50 px-4 py-3
           text-sm text-red-800 dark:border-red-500/40 dark:bg-red-500/10 dark:text-red-300">
      </div>

      <!-- Result tiles -->
      <div id="tiles" class="grid grid-cols-2 gap-4 md:grid-cols-4"></div>

      <!-- Force time-series chart -->
      <section class="rounded-xl border border-black/5 bg-white p-5 shadow-sm
                      dark:border-white/10 dark:bg-neutral-800/60">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-sm font-semibold">Force time series — one wave period</h2>
          <div id="legend" class="flex gap-4"></div>
        </div>
        <div id="chart" class="w-full"></div>
      </section>

    </main>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
