name: Desktop app

# Builds the installers on each operating system, then runs the desktop test
# suite against the packaged app on that same system. Installers are kept as
# workflow artifacts. When the version in package.json has no release yet,
# the tested installers are published as GitHub Release v<version> (tagging
# the built commit), with direct download links.

on:
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - 'electron/**'
      - 'electron-builder.yml'
      - 'build/**'
      - 'home.html'
      - 'index.html'
      - 'standalone.html'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      - 'studio/**'
      - 'tests/electron/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            app: release/win-unpacked/Offshore Studio.exe
          - name: macOS
            os: macos-latest
            app: release/mac-arm64/Offshore Studio.app/Contents/MacOS/Offshore Studio
          - name: Linux
            os: ubuntu-latest
            app: release/linux-unpacked/offshore-studio
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the studio
        run: npm run build:studio
      - name: Package installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Desktop tests on the packaged app (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test -c playwright.electron.config.js
        env:
          APP_EXECUTABLE: ${{ matrix.app }}
      - name: Desktop tests on the packaged app
        if: runner.os != 'Linux'
        run: npx playwright test -c playwright.electron.config.js
        env:
          APP_EXECUTABLE: ${{ matrix.app }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Offshore-Studio-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "$TAG is already released"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with:
          path: dist
          merge-multiple: true
      - name: Publish a release with the installers
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Offshore Studio $TAG" \
            --notes "Desktop installers for Windows, macOS and Linux. Not code-signed: see docs/DESKTOP.md for installation notes."
